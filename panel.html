<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fuera de buscadores: es una herramienta interna, no una página del sitio. -->
<meta name="robots" content="noindex, nofollow">
<title>Agenda · The Imperial Clasic</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css?v=7">
<link rel="stylesheet" href="assets/panel.css?v=4">
</head>
<body class="panel">

<!-- Entrada. Se muestra hasta que la sesión sea válida. -->
<section class="panel__login" id="login">
  <h1>Agenda</h1>
  <p class="panel__sub">The Imperial Clasic</p>
  <form id="form-login" autocomplete="off">
    <label class="sr-only" for="clave">Clave del local</label>
    <input id="clave" type="password" inputmode="text" placeholder="Clave" required
           autocomplete="current-password">
    <button class="btn btn--wine" type="submit">Entrar</button>
    <p class="panel__error" id="login-error" role="alert" hidden></p>
  </form>
</section>

<main class="panel__app" id="app" hidden>
  <header class="panel__top">
    <button class="panel__nav" type="button" id="dia-ant" aria-label="Día anterior">‹</button>
    <div class="panel__fecha">
      <strong id="dia-titulo">—</strong>
      <span id="dia-resumen"></span>
    </div>
    <button class="panel__nav" type="button" id="dia-sig" aria-label="Día siguiente">›</button>
  </header>

  <div class="panel__acciones">
    <button class="panel__chip" type="button" id="ir-hoy">Hoy</button>
    <!-- En escritorio se agenda tocando el hueco de la rejilla; en móvil no hay
         rejilla, así que hace falta una puerta explícita. -->
    <button class="panel__chip panel__chip--crear" type="button" id="abrir-crear">＋ Nueva cita</button>
    <button class="panel__chip" type="button" id="abrir-bloqueo">Bloquear horas</button>
    <button class="panel__chip panel__chip--salir" type="button" id="salir">Salir</button>
  </div>

  <!-- Escritorio: rejilla con una columna por profesional -->
  <div class="rejilla-wrap">
    <div class="rejilla" id="rejilla" aria-label="Agenda del día"></div>
  </div>

  <!-- Móvil: la misma información en lista -->
  <div id="lista" class="panel__lista" aria-live="polite"></div>

  <!-- Ficha de una cita -->
  <aside class="ficha" id="ficha" hidden aria-label="Detalle de la cita">
    <button class="ficha__cerrar" type="button" id="ficha-cerrar" aria-label="Cerrar">✕</button>
    <h2 id="ficha-cliente"></h2>
    <p class="ficha__meta" id="ficha-cuando"></p>
    <p class="ficha__tel" id="ficha-tel"></p>
    <p class="ficha__meta" id="ficha-serv"></p>
    <p class="ficha__total" id="ficha-total"></p>
    <div class="cita__btns" id="ficha-btns"></div>
  </aside>


  <!-- Crear cita desde el mostrador -->
  <dialog id="dlg-crear" class="panel__dlg">
    <form method="dialog" id="form-crear">
      <h2>Nueva cita</h2>

      <div class="panel__fila">
        <label>Profesional
          <select id="cr-prof" required></select>
        </label>
        <label>Hora
          <input id="cr-hora" type="time" required step="900">
        </label>
      </div>

      <label>Servicio
        <select id="cr-serv" required></select>
      </label>

      <label>Duración
        <span class="cr-dur">
          <input id="cr-min" type="number" min="5" max="600" step="5" required>
          <em id="cr-dur-nota"></em>
        </span>
      </label>

      <fieldset class="cr-cliente">
        <legend>Cliente</legend>
        <input id="cr-buscar" type="search" placeholder="Buscar por nombre o celular…"
               autocomplete="off" aria-label="Buscar cliente">
        <ul class="cr-lista" id="cr-lista"></ul>
        <p class="cr-elegido" id="cr-elegido" hidden></p>
        <div class="panel__fila" id="cr-nuevo">
          <label>Nombre <input id="cr-nombre" type="text" placeholder="Solo el nombre basta"></label>
          <label>Celular <input id="cr-tel" type="tel" inputmode="numeric" placeholder="Opcional"></label>
        </div>
      </fieldset>

      <p class="panel__error" id="cr-error" role="alert" hidden></p>
      <menu>
        <button class="btn btn--outline" value="cancel" type="submit">Cancelar</button>
        <button class="btn btn--wine" id="cr-guardar" type="button">Crear cita</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg-bloqueo" class="panel__dlg">
    <form method="dialog" id="form-bloqueo">
      <h2>Bloquear horas</h2>
      <label>Profesional
        <select id="bq-prof"><option value="">Todo el local</option></select>
      </label>
      <div class="panel__fila">
        <label>Desde <input id="bq-desde" type="time" required value="12:00"></label>
        <label>Hasta <input id="bq-hasta" type="time" required value="13:00"></label>
      </div>
      <label>Motivo <input id="bq-motivo" type="text" placeholder="Almuerzo, cita médica…"></label>
      <p class="panel__error" id="bq-error" role="alert" hidden></p>
      <menu>
        <button class="btn btn--outline" value="cancel" type="submit">Cancelar</button>
        <button class="btn btn--wine" id="bq-guardar" type="button">Bloquear</button>
      </menu>
    </form>
  </dialog>
</main>

<script src="assets/panel.js?v=4"></script>
</body>
</html>
